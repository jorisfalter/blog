  <p style="font-family:'DM Sans', Arial, sans-serif; font-size:32px; font-weight:600; letter-spacing:4px; text-transform:uppercase; color:#f0843c">Claude Code SEO</p>

  <p style="width:1300px; font-family:'DM Sans', Arial, sans-serif; font-size:44px; line-height:1.3; color:#b9bdc6">Free and self-hosted, with OpenSEO. And Umami as the cherry.</p>
</section></div><details class="notes"><summary>Notes</summary><p>Intro: I let Claude Code do the SEO for one of my hobby sites, using OpenSEO, a free open-source alternative to Semrush and Ahrefs that runs on my own server. First what it found and what changed, then how the setup works, a demo of my dashboard, and how it compares to Ubersuggest (Neil Patel), Ahrefs and Semrush. Visitor numbers come from Umami, my self-hosted analytics.</p></details></figure>

</section></div><details class="notes"><summary>Notes</summary><p>My test case: a hobby site with a live map of A380 routes. About 10,000 visitors in 30 days, 10% more than the period before (visitor numbers from Umami, my self-hosted analytics). 60% come via Google, plus Bing, DuckDuckGo and Reddit; mostly from the US, the UK, Germany and Australia. Two thirds are on a phone. 69% look at only one page. Everything on the next slides, all the keyword research, audits and backlink checks, cost about one dollar of DataForSEO credit.</p></details></figure>

<h3 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:56px;font-weight:700">Ranking</h3>
<p style="font-size:32px;color:#B9BDC6;line-height:1.4">Which shelf your book ends up on</p>
</div>

</section></div><details class="notes"><summary>Notes</summary><p>Quick metaphor before the tools. Google is a giant library and the librarian decides which book you get handed first. Keywords are the questions people ask at the desk. Backlinks are other books that point to yours, so the librarian trusts it more. Ranking is the shelf: eye level gets read, the bottom shelf on page 2 never does. SEO tools tell you what people ask, who recommends whom, and where you are on the shelf.</p></details></figure>
<figure id="slide-4" aria-label="Slide 4"><div class="frame"><section id="s-found" class="slide" style="background:#F4F1EA;color:#15181E;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:56px">
<h2 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1.1">What Claude found</h2>
<div style="display:flex;flex-direction:column;gap:0px;background:#FFFDF8;border:1px solid #E2DDD2;border-radius:20px">
<div style="display:flex;gap:48px;align-items:center;padding:28px 56px;border-bottom:1px solid #E2DDD2;background:#15181E;border-radius:20px 20px 0px 0px">
<p style="width:820px;font-size:28px;font-weight:600;color:#F0843C;letter-spacing:3px;text-transform:uppercase">The problem</p>
<p style="flex:1;font-size:28px;font-weight:600;color:#F4F1EA;letter-spacing:3px;text-transform:uppercase">The fix</p>
</div>
<div style="display:flex;gap:48px;align-items:center;padding:40px 56px;border-bottom:1px solid #E2DDD2">
<p style="width:820px;font-size:36px;font-weight:600">Google can't read an interactive map</p>
<p style="flex:1;font-size:36px;color:#3A3F48">Added plain text pages</p>
</div>
<div style="display:flex;gap:48px;align-items:center;padding:40px 56px;border-bottom:1px solid #E2DDD2">
<p style="width:820px;font-size:36px;font-weight:600">Google sent people to the wrong page</p>
<p style="flex:1;font-size:36px;color:#3A3F48">One clear title per page</p>
</div>
<div style="display:flex;gap:48px;align-items:center;padding:40px 56px;border-bottom:1px solid #E2DDD2">
<p style="width:820px;font-size:36px;font-weight:600">Seen in Google, rarely clicked</p>
<p style="flex:1;font-size:36px;color:#3A3F48">Answer the question right away</p>
</div>
<div style="display:flex;gap:48px;align-items:center;padding:40px 56px">
<p style="width:820px;font-size:36px;font-weight:600">Most visitors are on a phone</p>
<p style="flex:1;font-size:36px;color:#3A3F48">Fixed mobile first</p>
</div>
</div>
</section></div><details class="notes"><summary>Notes</summary><p>Claude Code pulled the data from OpenSEO and Search Console, I looked at it together with Claude, and Claude made the changes. Left the problem, right the fix. 1) Google can&#x27;t read an interactive map: a map drawn by code is invisible to Google, like a painting in a dark room. Google reads text. So I added normal pages with text, plus a map as a plain image. 2) Google sent people to the wrong page: searches about one airline landed on my homepage instead of that airline&#x27;s page, and hardly anyone clicked. Fix: every page gets a title that says exactly what is on it, and clear links between pages. 3) Seen in Google, rarely clicked: popular questions showed my site in the results, but people didn&#x27;t click. A shop window everybody walks past. Fix: one page that answers the question right at the top. 4) Two thirds of visitors are on a phone, and that is where the site was worst. So mobile came first.</p></details></figure>
<figure id="slide-5" aria-label="Slide 5"><div class="frame"><section id="s-surprises" class="slide" style="display:flex; flex-direction:column; gap:64px; padding:128px; background:#f4f1ea">
  <h2 style="font-family:'Space Grotesk', Arial, sans-serif; font-size:72px; font-weight:700; line-height:1.1; color:#15181e">And a few surprises</h2>
  <div style="display:grid; gap:28px; grid-template-columns:1fr 1fr">
    <div style="display:flex; flex-direction:column; gap:16px; padding:48px; background:#fffdf8; border:1px solid #e2ddd2; border-radius:20px">

        <h3 style="font-family:'Space Grotesk', Arial, sans-serif; font-size:40px; font-weight:700; color:#15181e">ChatGPT knows me</h3>
      </div>
      <p style="font-family:'DM Sans', Arial, sans-serif; font-size:30px; line-height:1.4; color:#3a3f48">It cites my site as a source. Perplexity sticks to big media.</p>

</section></div><details class="notes"><summary>Notes</summary><p>1) Traffic I didn&#x27;t expect: one of my biggest entry pages is a side page I never did any SEO work on. Check which pages people really land on; it is rarely the ones you think. 2) ChatGPT already names the site as one of its sources for a common question in my niche. Perplexity doesn&#x27;t mention it; it mostly cites well-known media. 3) Almost all the sites linking to me are spam, like junk link directories. Competitors get their links from blogs and forums in the niche, so that is where the chances are: ask those sites. 4) The tools have pitfalls: the rank tracker once said &quot;not found&quot; because of an error at the data provider, and a one-off check in Google put me on page 2 while Search Console averaged a top-3 position. Lesson: trust Search Console over one-off measurements.</p></details></figure>
<figure id="slide-6" aria-label="Slide 6"><div class="frame"><section id="s-click" class="slide" style="background:#F4F1EA;color:#15181E;font-family:'DM Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:56px">
<div style="display:flex;flex-direction:column;gap:20px">
<h2 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:72px;font-weight:700;line-height:1.1">Before and after the click</h2>

<div style="display:flex;gap:24px;align-items:center">

<div style="display:flex;align-items:center;gap:24px"><span class="xi" role="img" aria-label="Chart" style="color:#F0843C;width:56px;height:56px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><rect x="4" y="12" width="4" height="7" rx="1"/><rect x="10" y="5" width="4" height="14" rx="1"/><rect x="16" y="9" width="4" height="10" rx="1"/></svg></span><h3 style="font-family:'Space Grotesk', Arial, sans-serif;font-size:44px;font-weight:700">Umami</h3></div>
<p style="font-size:32px;color:#B9BDC6;line-height:1.4">Where visitors land, and whether they stay</p>
</div>
</div>
<p style="font-size:36px;font-weight:600;line-height:1.4;width:1600px">Google sent people to my homepage. Umami showed most left after one page. <span style="color:#D9651F">Together: they couldn't find what they came for.</span></p>
</section></div><details class="notes"><summary>Notes</summary><p>Each tool measures half the story. OpenSEO with Search Console is before the click: where you appear in Google, for which searches, at which position, and how often people click. Umami is after the click: where visitors land, on which device, and whether they click on or leave. What the combination showed: 1) Mobile: both showed about two thirds of visitors on a phone. Looking at the mobile version turned up four real bugs. 2) The homepage gets the clicks, then it stops: Search Console showed searches about specific airlines landing on the homepage, Umami showed most visitors view only one page. Together: people don&#x27;t find the page they were looking for. Hence links under the map and inside the map. 3) Traffic SEO didn&#x27;t see coming: Umami showed a side page as a top entry page, while the SEO tools said nothing about it. 4) AI as a source: OpenSEO showed ChatGPT names the site, and Umami shows the first visitors arriving from AI tools like Gemini. Next: Umami now counts clicks on the new links under the map. In a few weeks: Search Console shows people coming in, Umami shows whether they click on. A before-and-after for a follow-up video. Note: OpenSEO can combine Search Console with analytics, but only with Google Analytics, not Umami, so Claude combines the two itself.</p></details></figure>

</section></div><details class="notes"><summary>Notes</summary><p>What the restaurant has that your kitchen doesn&#x27;t, and when you actually need it. Short version: you need these when SEO is your job (clients, a marketing team, ads), rarely when you build a few sites of your own.</p><p>Own crawler: Ahrefs and Semrush own the farm. They crawl the web themselves, keep years of history and have their own scores (Domain Rating, Authority Score). OpenSEO buys its ingredients from a wholesaler, DataForSEO. You need the farm for serious link building: deep backlink audits, or seeing how a competitor&#x27;s links grew over the years. For &quot;who links to me&quot;, DataForSEO is enough.</p><p>Content tools: they score your text against the pages that rank now: missing words, length. Useful when you have lots of articles written, especially by writers who don&#x27;t know SEO. With Claude you can do this yourself.</p><p>Ads research: which Google Ads keywords competitors bid on, their ad copy and an estimated budget. Only needed if you run Google Ads yourself; for organic traffic you don&#x27;t.</p><p>Client reports: a monthly PDF with your own logo, sent automatically, with logins for clients and colleagues. Needed if you run an SEO agency.</p><p>Browser plugin: a bar in Chrome that shows the numbers next to every Google result and site. Handy for quick checks, never essential.</p><p>Support: a helpdesk plus courses like Semrush Academy and Ahrefs Academy. Useful if you are new to SEO, or in a team with nobody technical.</p><p>And the data is often already in DataForSEO, so Claude can build the missing piece. Check the list before recording: features change fast on all four tools.</p></details></figure>

<p style="position:absolute;left:128px;bottom:64px;width:1664px;font-size:24px;color:#7A7F88">Ahrefs and Semrush can add up all countries. Every tool's traffic number is an estimate.</p>
</section></div><details class="notes"><summary>Notes</summary><p>A surprise I ran into. Every OpenSEO project has one location, and the default is the United States. My site&#x27;s project was on that default, so the 320 is only the estimated Google traffic from the US, and without the long tail. Search Console showed 5,500, worldwide, real clicks. OpenSEO can&#x27;t give one worldwide number because DataForSEO works per country. If you want other countries, make a project per country, for example the UK or Australia; each lookup costs a few cents of DataForSEO credit. How the others do it: Ahrefs and Semrush also keep their data per country, but they can add all countries up into one worldwide number and show a global search volume next to the local one. Ubersuggest also works per country . And all of them estimate traffic from rankings; none of them sees your real visitors. Lesson: for your own site, Search Console is the source of truth. Use SEO tools for competitors and for finding new keywords.</p></details></figure>

</section></div><details class="notes"><summary>Notes</summary><p>Cook at home, order in, or go to the restaurant. For most indie hackers and solo founders the first row is you.</p><p>Why agencies still pick Ahrefs or Semrush: strictly you don&#x27;t need them for client reports, I built my own weekly report on OpenSEO. But for an agency: the reports are ready-made, nothing to build or maintain, which matters with 30 clients. Clients know the numbers and often ask for their &quot;Domain Rating&quot; or &quot;Authority Score&quot;, which are Ahrefs&#x27; and Semrush&#x27;s own scores and can&#x27;t be rebuilt. You can look back years (&quot;last year you were here&quot;) only if you have collected data that long. And they are built for teams: logins per colleague and per client.</p></details></figure>

<script>
(function(){
  var q=/[?&]slide=(\d+)/.exec(location.search);
  if(q){document.documentElement.classList.add('single');
    [].slice.call(document.querySelectorAll('figure')).forEach(function(f,i){if(i+1!==+q[1])f.remove();});}
  var frames=[].slice.call(document.querySelectorAll('.frame'));
  function fit(){frames.forEach(function(f){f.style.setProperty('--s',(f.clientWidth/1920).toString());});}
  fit();window.addEventListener('resize',fit);
  if('ResizeObserver' in window){var ro=new ResizeObserver(fit);frames.forEach(function(f){ro.observe(f);});}
  document.addEventListener('keydown',function(e){
    if(e.target.closest&&e.target.closest('summary,input,textarea'))return;
    var k=e.key;if(k!=='ArrowRight'&&k!=='ArrowLeft'&&k!=='PageDown'&&k!=='PageUp')return;
    var y=window.scrollY+8,cur=0;
    frames.forEach(function(f,i){if(f.getBoundingClientRect().top+window.scrollY<=y)cur=i;});
    var n=(k==='ArrowRight'||k==='PageDown')?Math.min(cur+1,frames.length-1):Math.max(cur-1,0);
    frames[n].scrollIntoView({behavior:'smooth',block:'start'});e.preventDefault();
  });
